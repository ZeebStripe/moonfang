<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonfang 3D</title>
    <meta name="description" content="Open source 3D texture painting: PBR layer painting, baked mesh maps, smart masks and smart materials." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8633a'/%3E%3Cpath d='M9 21c4-9 9-1 14-11' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <aside id="toolbar"></aside>
      <main id="viewport-wrap">
        <canvas id="viewport" tabindex="0"></canvas>
        <div id="brush-cursor" class="brush-cursor"></div>
      </main>
      <aside id="sidebar">
        <section id="layers-panel" class="panel"></section>
        <section id="props-panel" class="panel"></section>
      </aside>
      <footer id="shelf"></footer>
      <div id="statusbar"></div>
    </div>
    <div id="fatal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
