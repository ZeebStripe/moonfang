name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Moonfang to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you with?
      description: Your workflow or the problem it solves. If another tool does this well, tell us how it works there.
